name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  # step 1: build official MacOS & linus binaries & create artifacts for release.
  build-binaries:
    if: github.event.pull_request.merged == true

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: linux-x86_64
          - os: macos-latest
            asset_name: macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Install ncurses (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses-dev

      - name: Install ncurses (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ncurses

      - name: Configure
        run: |
          EXTRA_ARGS=""
          if [ "${{ runner.os }}" = "macOS" ]; then
            EXTRA_ARGS="-DCMAKE_PREFIX_PATH=$(brew --prefix ncurses)"
          fi

          cmake \
            -B build \
            -S . \
            -DCMAKE_BUILD_TYPE=Release \
            $EXTRA_ARGS

      - name: Build
        run: |
          cmake --build build \
            --config Release \
            --parallel

      - name: Install
        run: |
          cmake --install build \
            --prefix package

      - name: Read version
        id: version
        run: |
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Create release archive
        run: |
          tar -czf "roguelike-${{ steps.version.outputs.version }}-${{ matrix.asset_name }}.tar.gz" \
            -C package .

      - name: Generate checksum
        run: |
          sha256sum \
            "roguelike-${{ steps.version.outputs.version }}-${{ matrix.asset_name }}.tar.gz" \
            > "roguelike-${{ steps.version.outputs.version }}-${{ matrix.asset_name }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: roguelike-${{ matrix.asset_name }}
          path: |
            roguelike-${{ steps.version.outputs.version }}-${{ matrix.asset_name }}.tar.gz
            roguelike-${{ steps.version.outputs.version }}-${{ matrix.asset_name }}.sha256

  # publish release w/ binary distributions.
  publish-release:
    needs: build-binaries

    if: github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Verify release tag
        run: |
          git fetch --tags

          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ steps.version.outputs.version }} already exists."
            exit 1
          fi

      - name: Extract release notes
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$PR_BODY" \
            | awk '/^## Release Notes/{f=1; next} /^## /{f=0} f' \
            > notes.md

          if [ ! -s notes.md ]; then
            echo "::error::Release Notes section is missing from the pull request."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: roguelike-*
          merge-multiple: true
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Roguelike v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          body_path: notes.md
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: |
            dist/*.tar.gz
            dist/*.sha256
