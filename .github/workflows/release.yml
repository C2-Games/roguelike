name: Release

on:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ncurses (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses-dev

      - name: Install ncurses (macOS)
        if: runner.os == 'macOS'
        run: brew install ncurses

      - name: Configure
        run: cmake -B build -S .

      - name: Build
        run: cmake --build build -j

      - name: Package artifact
        run: |
          mkdir -p package
          cp build/roguelike package/
          cp -r assets package/
          tar -czf roguelike-${{ matrix.os }}.tar.gz -C package .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: roguelike-${{ matrix.os }}
          path: roguelike-${{ matrix.os }}.tar.gz

  check-version:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          version=$(cat VERSION | tr -d '[:space:]')
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" != "$latest_tag" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  publish-release:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: roguelike-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          generate_release_notes: true
          files: dist/*.tar.gz
